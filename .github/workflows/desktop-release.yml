name: Publicar release de escritorio

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar artefactos firmados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "release/UPI-Party-${version}-x64-setup.exe" \
            "release/UPI-Party-${version}-x64-setup.exe.sig" \
            release/latest.json \
            --title "UPI Party $GITHUB_REF_NAME" \
            --notes "Actualización automática de UPI Party."
